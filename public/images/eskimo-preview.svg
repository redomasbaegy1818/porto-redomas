<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="eskimoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#eskimoGrad)"/>
  
  <!-- Outer Hairline Frame -->
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="rgba(242, 239, 232, 0.15)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="40" y="40" width="1120" height="50" fill="#1C1C1F"/>
  <circle cx="70" cy="65" r="6" fill="#FF5F56"/>
  <circle cx="95" cy="65" r="6" fill="#FFBD2E"/>
  <circle cx="120" cy="65" r="6" fill="#27C93F"/>
  <rect x="160" y="52" width="460" height="26" rx="4" fill="#0B0B0C"/>
  <text x="180" y="69" font-family="monospace" font-size="11" fill="#8E8D8A">eskimo.project/overview</text>

  <g transform="translate(90, 140)">
    <!-- Simulated Hero Landing Page -->
    <rect x="0" y="0" width="1020" height="440" fill="#0B0B0C" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>
    
    <text x="60" y="80" font-family="monospace" font-size="12" fill="#C6FF3D" letter-spacing="3">PROJECT KAMPUS • AMIKOM YOGYAKARTA</text>
    <text x="60" y="150" font-family="sans-serif" font-weight="900" font-size="52" fill="#F2EFE8" letter-spacing="-2">ESKIMO LANDING PAGE</text>
    <text x="60" y="195" font-family="sans-serif" font-size="18" fill="#8E8D8A">Portal pengenalan resmi dan panduan akses layanan digital terpadu.</text>

    <!-- Simulated CTA Button -->
    <rect x="60" y="235" width="220" height="48" fill="#C6FF3D"/>
    <text x="95" y="265" font-family="monospace" font-size="12" font-weight="bold" fill="#0B0B0C" letter-spacing="1">JELAJAHI FITUR →</text>

    <!-- Simulated 3-step feature cards -->
    <g transform="translate(60, 320)">
      <rect x="0" y="0" width="280" height="70" fill="#141416" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>
      <text x="20" y="30" font-family="monospace" font-size="11" fill="#C6FF3D">01 / ORIENTASI</text>
      <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#F2EFE8">Pengenalan fungsi esensial</text>

      <rect x="310" y="0" width="280" height="70" fill="#141416" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>
      <text x="330" y="30" font-family="monospace" font-size="11" fill="#C6FF3D">02 / FITUR UTAMA</text>
      <text x="330" y="52" font-family="sans-serif" font-size="12" fill="#F2EFE8">Rincian alur dan modul</text>

      <rect x="620" y="0" width="280" height="70" fill="#141416" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>
      <text x="640" y="30" font-family="monospace" font-size="11" fill="#C6FF3D">03 / AKSES MUDAH</text>
      <text x="640" y="52" font-family="sans-serif" font-size="12" fill="#F2EFE8">Pintu masuk pengguna baru</text>
    </g>
  </g>
</svg>
