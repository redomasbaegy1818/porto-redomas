<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="larasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0E0F10"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#larasGrad)"/>
  
  <!-- Outer Hairline Frame -->
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="rgba(242, 239, 232, 0.15)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="40" y="40" width="1120" height="50" fill="#1C1C1F"/>
  <circle cx="70" cy="65" r="6" fill="#FF5F56"/>
  <circle cx="95" cy="65" r="6" fill="#FFBD2E"/>
  <circle cx="120" cy="65" r="6" fill="#27C93F"/>
  <rect x="160" y="52" width="460" height="26" rx="4" fill="#0B0B0C"/>
  <text x="180" y="69" font-family="monospace" font-size="11" fill="#8E8D8A">laras.surakarta.go.id/agenda-kota</text>

  <g transform="translate(90, 140)">
    <!-- Header -->
    <text x="0" y="40" font-family="sans-serif" font-weight="900" font-size="34" fill="#F2EFE8" letter-spacing="-1">LARAS</text>
    <text x="140" y="38" font-family="monospace" font-size="12" fill="#C6FF3D" letter-spacing="2">LAYANAN AGENDA &amp; RAGAM ACARA SURAKARTA</text>
    <line x1="0" y1="65" x2="1020" y2="65" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>

    <!-- Calendar & Agenda Cards Grid -->
    <g transform="translate(0, 95)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="320" height="300" fill="#0B0B0C" stroke="rgba(198, 255, 61, 0.3)" stroke-width="1"/>
      <rect x="20" y="20" width="280" height="130" fill="#1C1C1F"/>
      <text x="40" y="85" font-family="sans-serif" font-weight="bold" font-size="14" fill="#C6FF3D">FESTIVAL BUDAYA SOLO</text>
      <text x="20" y="180" font-family="monospace" font-size="11" fill="#8E8D8A">24 OKTOBER 2024</text>
      <text x="20" y="210" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F2EFE8">Solo Menari &amp; Kirab Pusaka</text>
      <text x="20" y="240" font-family="sans-serif" font-size="12" fill="#8E8D8A">Balai Kota Surakarta — Jl. Jend. Sudirman</text>

      <!-- Card 2 -->
      <rect x="350" y="0" width="320" height="300" fill="#0B0B0C" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>
      <rect x="370" y="20" width="280" height="130" fill="#1C1C1F"/>
      <text x="390" y="85" font-family="sans-serif" font-weight="bold" font-size="14" fill="#C6FF3D">SENI PERTUNJUKAN</text>
      <text x="370" y="180" font-family="monospace" font-size="11" fill="#8E8D8A">02 NOVEMBER 2024</text>
      <text x="370" y="210" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F2EFE8">Ketoprak Sriwedari Spesial</text>
      <text x="370" y="240" font-family="sans-serif" font-size="12" fill="#8E8D8A">Gedung Wayang Orang Sriwedari</text>

      <!-- Card 3 -->
      <rect x="700" y="0" width="320" height="300" fill="#0B0B0C" stroke="rgba(242, 239, 232, 0.1)" stroke-width="1"/>
      <rect x="720" y="20" width="280" height="130" fill="#1C1C1F"/>
      <text x="740" y="85" font-family="sans-serif" font-weight="bold" font-size="14" fill="#C6FF3D">EXPO &amp; KREATIF</text>
      <text x="720" y="180" font-family="monospace" font-size="11" fill="#8E8D8A">15 NOVEMBER 2024</text>
      <text x="720" y="210" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F2EFE8">Surakarta IT &amp; Creative Week</text>
      <text x="720" y="240" font-family="sans-serif" font-size="12" fill="#8E8D8A">Pamedan Mangkunegaran</text>
    </g>
  </g>
</svg>
